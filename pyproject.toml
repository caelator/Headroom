[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom"
version = "0.1.0"
description = "Local, authenticated AI plan quotas, usage velocity and reset-aware forecasts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/caelator/Headroom"
Documentation = "https://github.com/caelator/Headroom#readme"
Issues = "https://github.com/caelator/Headroom/issues"

[project.scripts]
headroom = "aiusage.server:main"

[tool.setuptools.packages.find]
where = ["src"]
